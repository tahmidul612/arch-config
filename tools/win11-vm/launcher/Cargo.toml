[package]
name = "vm-launch"
version = "0.1.0"
edition = "2021"
description = "Launcher for the win11 Remote Play VM (display path, resolution, extras)"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
inotify = { version = "0.11", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
