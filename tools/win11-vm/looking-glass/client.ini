; Looking Glass B8 client for the win11 VM
[lgmp]
shmDevice=/dev/shm/looking-glass

[win]
title=Windows VM
; keep the guest at its fixed mode (1920x1080 in lg mode, upscaled below) instead of resizing it to this window
setGuestRes=no

[spice]
; VM audio already reaches the host through QEMU's PipeWire backend ("Windows VM" sink, recorded by OBS);
; the client's USB audio device would steal Windows' default output and bypass that.
audio=no

[input]
; the MX Keys has no Scroll Lock: Right Ctrl is the Looking Glass key (tap = capture, Right Ctrl+F = fullscreen, +Q = quit, +O = overlay)
escapeKey=KEY_RIGHTCTRL

[eglFilter]
; AMD FidelityFX FSR 1 upscales the 1080p guest to the 4K LG (at the client's default sharpness, 1.0). Measured
; against Looking Glass's default (nearest at exactly 2x), linear, CAS, FSR+CAS and a 4K guest: the best on VMAF NEG,
; and at least as sharp as the 4K guest for a 1080p Remote Play stream. See docs/Gaming/Windows VM/display.md.
ffxFSR=yes
ffxFSRSharpness=1.0
