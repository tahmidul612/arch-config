; Looking Glass B8 client for the win11 VM
[app]
shmFile=/dev/shm/looking-glass

[win]
title=Windows VM
; keep the guest at its fixed mode (3840x2160; host OBS records that) instead of resizing it to this window
setGuestRes=no

[spice]
; VM audio already reaches the host through QEMU's PipeWire backend ("Windows VM" sink, recorded by OBS);
; the client's USB audio device would steal Windows' default output and bypass that.
audio=no

[input]
; the MX Keys has no Scroll Lock: Right Ctrl is the Looking Glass key (tap = capture, Right Ctrl+F = fullscreen, +Q = quit, +O = overlay)
escapeKey=KEY_RIGHTCTRL
