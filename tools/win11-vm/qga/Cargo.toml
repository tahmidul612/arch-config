[package]
name = "qga"
version = "0.1.0"
description = "Run PowerShell in, and copy files to/from, a libvirt guest via qemu-guest-agent"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.9", features = ["derive", "env"] }
serde_json = "1.0.154"
virt = { version = "0.5.0", features = ["qemu"] }
