# Host (server) settings: ~/.config/Deskflow/Deskflow.conf
# Replace <HOST> with the host's hostname (`hostname`) and <USER> with your user name.
# Deskflow 1.27 needs every computer declared here; a "screens" section in the server config is ignored.
[computer_<HOST>]
name=<HOST>

[computer_win11]
name=win11

[core]
computerName=<HOST>
coreMode=2
port=24800

[gui]
autoHide=true
closeToTray=true
enableUpdateCheck=false
startCoreWithGui=true

[security]
certificate=/home/<USER>/.config/Deskflow/tls/deskflow.pem
checkPeerFingerprints=true
tlsEnabled=true

[server]
enableClipboard=true
externalConfig=true
externalConfigFile=/home/<USER>/.config/Deskflow/deskflow-server.conf
