# Guest (client) settings: C:\ProgramData\Deskflow\Deskflow.conf, read by the Deskflow Windows service.
# 192.168.122.1 is the host on libvirt's default NAT network.
[core]
coreMode=1
computerName=win11
port=24800

[client]
remoteHost=192.168.122.1

[daemon]
configFile=C:/ProgramData/Deskflow/Deskflow.conf
elevate=true

[gui]
enableUpdateCheck=false

[security]
tlsEnabled=true
checkPeerFingerprints=true
certificate=C:/ProgramData/Deskflow/tls/deskflow.pem
