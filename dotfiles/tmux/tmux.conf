# ~/.config/tmux/tmux.conf — shared by the laptop and the server
#
# Default prefix (Ctrl-b) and default bindings, so tmux tutorials apply as-is.
#
#   Ctrl-b ?   searchable cheatsheet: tmux + plugins + live bindings (fzf popup)
#   F12        (local server only) turn this tmux "off" so keys reach a nested remote tmux
#
# Per-machine settings (accent colour, desktop notifications) go in
# ~/.config/tmux/local.conf, which is sourced near the end and not shared.
# Plugins live in ~/.tmux/plugins (tmux-agent-sidebar's hooks expect that path).

# --- Terminal: kitty, and tmux nested inside tmux over SSH ------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:clipboard:extkeys:focus:sync:usstyle:hyperlinks"
set -as terminal-features ",tmux*:RGB:clipboard:extkeys:focus:sync:usstyle:hyperlinks"
set -g extended-keys on              # Shift+Enter etc. reach Claude Code
set -g extended-keys-format csi-u
set -g focus-events on
set -g set-clipboard on              # OSC 52: copies (even remote ones) reach kitty
set -g allow-passthrough on          # kitty graphics (yazi image previews)
set -ga update-environment "TERM TERM_PROGRAM KITTY_WINDOW_ID SSH_CONNECTION"
set -sg escape-time 10

# --- General ---------------------------------------------------------------
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#H: #S/#W"
setw -g automatic-rename on
set -g display-time 2000
setw -g aggressive-resize on
set -g detach-on-destroy off         # killing a session jumps to another one
setw -g monitor-activity on
setw -g monitor-bell on
set -g bell-action any               # a bell in any window flags it (and passes outward)
set -g visual-activity off
set -g visual-bell off

# --- Copy mode: vi keys --------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Extras (prefix) -------------------------------------------------------------
bind -N "Cheatsheet: tmux + plugins + live bindings (search)" ? \
    display-popup -E -w 90% -h 90% -T " tmux cheatsheet " "~/.config/tmux/cheatsheet.sh"
bind -N "Reload tmux.conf" r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
bind -N "Split left/right (same dir)" | split-window -h -c "#{pane_current_path}"
bind -N "Split top/bottom (same dir)" - split-window -v -c "#{pane_current_path}"
bind -N "New window (same dir)" c new-window -c "#{pane_current_path}"

# Alt+Shift+Left/Right switch windows without the prefix. (Plain Alt+arrows are
# taken by fish: directory history / word movement and token history search.)
# In a nested SSH tmux the outer one catches these first; press F12 to pass them in.
bind -n -N "Previous window (no prefix)" M-S-Left previous-window
bind -n -N "Next window (no prefix)" M-S-Right next-window

# Scratch terminal: a popup attached to session "scratch"; the same key hides it again
# and it keeps its state. (Native floating panes: Ctrl-b * new, @ float/tile, g move.)
bind -N "Toggle scratch terminal (popup)" P if -F "#{==:#{session_name},scratch}" {
    detach-client
} {
    display-popup -E -w 80% -h 75% -d "#{pane_current_path}" -T " scratch " \
        "env -u TMUX tmux new -A -s scratch \\; set status off"
}

# Session picker: sesh (projects via zoxide) if installed, else plain tmux sessions
if 'command -v sesh >/dev/null' {
    bind -N "Session/project picker (sesh)" S display-popup -E -w 70% -h 60% -T " sesh " \
        'sesh connect "$(sesh list --icons | fzf --ansi --reverse --no-sort --prompt "⚡ " \
            --header "^a all  ^t tmux  ^x zoxide dirs  ^d kill session" \
            --bind "ctrl-a:change-prompt(⚡ )+reload(sesh list --icons)" \
            --bind "ctrl-t:change-prompt(🪟 )+reload(sesh list -t --icons)" \
            --bind "ctrl-x:change-prompt(📁 )+reload(sesh list -z --icons)" \
            --bind "ctrl-d:execute(tmux kill-session -t {2..})+reload(sesh list --icons)")"'
} {
    bind -N "Session picker (fzf)" S display-popup -E -w 60% -h 50% \
        "tmux ls -F '#S' | fzf --reverse --prompt 'session> ' | xargs -r tmux switch-client -t"
}

# --- Accent colour (override per machine in local.conf) ---------------------------
# @accent is used in status formats; border styles need the literal colour.
set -g @accent "#c792ea"
set -g pane-active-border-style "fg=#c792ea"
set -g popup-border-style "fg=#c792ea"

# --- Nesting: F12 turns this (outer) tmux off; only on a locally started server ----
if '[ -z "$SSH_CONNECTION" ]' {
    bind -T root F12 {
        set prefix None
        set key-table off
        if -F '#{pane_in_mode}' { send -X cancel }
        refresh-client -S
    }
    bind -T off F12 {
        set -u prefix
        set -u key-table
        refresh-client -S
    }
}

# --- Status bar (top, Night Owl) ----------------------------------------------------
# Window icons come from tmux-agent-sidebar's pane options (@pane_status / @pane_attention).
set -g status-position top
set -g status-interval 5
# The bar sits on Night Owl's raised surface (#0b2942) rather than the terminal
# background (#011627), so it reads as a bar. A second status line draws a thin
# accent rule hugging its lower edge (▔ = upper 1/8 block); the rest of that row
# is blank (bg=terminal, i.e. kitty's own translucent bg), which keeps pane
# content from butting up against the bar.
set -g status 2
set -g status-style "bg=#0b2942,fg=#d6deeb"
set -g status-format[1] "#[align=left fill=terminal bg=terminal fg=#{@accent}]#{R:▔,#{client_width}}"
set -g status-left-length 40
set -g status-left "#{?#{==:#{client_key_table},off},#[bg=#1d3b53 fg=#637777] #H OFF ,#[bg=#{@accent} fg=#011627 bold] #H }#[default] #[fg=#{@accent}]#S#[default] │ "
set -g status-right-length 40
set -g status-right "#{?client_prefix,#[fg=#011627 bg=#f78c6c bold] PREFIX #[default] ,}#[fg=#637777]%a %d %b  #[fg=#d6deeb]%H:%M "
set -g @agent_icon "#{?#{==:#{@pane_attention},1},#[fg=#f78c6c]●,#{?#{==:#{@pane_status},waiting},#[fg=#f78c6c]●,#{?#{==:#{@pane_status},running},#[fg=#637777]⏳,#{?#{==:#{@pane_status},error},#[fg=#ef5350]✗,}}}}"
setw -g window-status-format "#[fg=#637777]#I:#W#{?window_zoomed_flag, [Z],} #{E:@agent_icon}"
setw -g window-status-current-format "#[fg=#{@accent} bold]#I:#W#{?window_zoomed_flag, [Z],} #{E:@agent_icon}"
setw -g window-status-separator "  "
setw -g window-status-activity-style "fg=#ecc48d"
setw -g window-status-bell-style "fg=#f78c6c,bold"
set -g pane-border-style "fg=#1d3b53"
set -g message-style "bg=#1d3b53,fg=#d6deeb"
set -g mode-style "bg=#1d3b53,fg=#d6deeb"
set -g popup-border-lines rounded

# --- Plugins (TPM) ---------------------------------------------------------------------
# Ctrl-b I install · Ctrl-b U update · Ctrl-b M-u remove unlisted
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'hiroppy/tmux-agent-sidebar'
set -g @plugin 'Morantron/tmux-fingers'

# resurrect + continuum: save every 15 min, restore when the server starts
set -g @resurrect-dir "$HOME/.local/share/tmux/resurrect"
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# agent sidebar: hidden until toggled (Ctrl-b a here, Ctrl-b A in all windows)
set -g @sidebar_key 'a'
set -g @sidebar_key_all 'A'
set -g @sidebar_auto_create 'off'
set -g @sidebar_width '30%'
set -g @sidebar_color_accent '111'
set -g @sidebar_notifications 'off'      # local.conf turns this on where a notification daemon runs

# fingers: Ctrl-b F hint-copy, Ctrl-b J hint-jump (defaults)
set -g @fingers-key 'F'
set -g @fingers-jump-key 'J'

# Machine-specific overrides (accent, notifications); optional
source-file -q ~/.config/tmux/local.conf

# Fresh machine: clone TPM only, then press Ctrl-b I to install the plugins
# (fingers and the sidebar run an install wizard that needs you there).
if "test ! -d $HOME/.tmux/plugins/tpm" \
    "run 'git clone -q https://github.com/tmux-plugins/tpm $HOME/.tmux/plugins/tpm'"
run -b "$HOME/.tmux/plugins/tpm/tpm"
