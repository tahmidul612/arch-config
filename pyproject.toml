[project]
name = "arch-config"
version = "0.1.0"
description = "MkDocs source for the Arch Linux (CachyOS) setup guide"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mkdocs>=1.6.1",
    "mkdocs-material[imaging]>=9.6.20",
    "mkdocs-callouts>=1.16.0",
    "mkdocs-include-markdown-plugin>=7.1.7",
    "mkdocs-macros-plugin>=1.4.0",
    "mkdocs-replace-markdown>=0.1.0",
]
